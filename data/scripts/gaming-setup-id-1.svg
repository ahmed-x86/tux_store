<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#1a2520"/>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="#a6e3a1" stroke-width="2.5" opacity="0.9"/>

  <!-- Controller body -->
  <path d="M10 30 C10 24 14 20 20 20 L44 20 C50 20 54 24 54 30 L54 36 C54 44 46 50 40 46 L36 44 L28 44 L24 46 C18 50 10 44 10 36 Z" fill="none" stroke="#a6e3a1" stroke-width="2.5"/>

  <!-- Left thumbstick -->
  <circle cx="21" cy="35" r="5" fill="none" stroke="#a6e3a1" stroke-width="2"/>
  <circle cx="21" cy="35" r="2" fill="#a6e3a1" opacity="0.6"/>

  <!-- Right thumbstick -->
  <circle cx="39" cy="35" r="5" fill="none" stroke="#a6e3a1" stroke-width="2"/>
  <circle cx="39" cy="35" r="2" fill="#a6e3a1" opacity="0.6"/>

  <!-- D-pad (left) -->
  <path d="M18 27 V21 M15 24 H21" stroke="#a6e3a1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Action buttons (right) - ABXY -->
  <circle cx="47" cy="26" r="2.5" fill="none" stroke="#f38ba8" stroke-width="2"/> <!-- top -->
  <circle cx="47" cy="32" r="2.5" fill="none" stroke="#f9e2af" stroke-width="2"/> <!-- right -->
  <circle cx="41" cy="26" r="2.5" fill="none" stroke="#89b4fa" stroke-width="2"/> <!-- left -->
  <circle cx="41" cy="32" r="2.5" fill="none" stroke="#a6e3a1" stroke-width="2"/> <!-- bottom -->

  <!-- Shoulder bumpers hint -->
  <path d="M15 20 C14 17 17 15 20 16" fill="none" stroke="#a6e3a1" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M49 20 C50 17 47 15 44 16" fill="none" stroke="#a6e3a1" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Center button / home -->
  <circle cx="32" cy="30" r="3.5" fill="none" stroke="#a6e3a1" stroke-width="2" opacity="0.7"/>
  <circle cx="32" cy="30" r="1.2" fill="#a6e3a1" opacity="0.5"/>
</svg>
