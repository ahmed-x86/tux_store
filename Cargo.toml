[workspace]
resolver = "2"
members = [
    "crates/tux-abi",
    "crates/tux-backend",
    "crates/tux-appstream",
    "crates/tux-taxonomy",
    "crates/tux-pacman",
    "crates/tux-libalpm",
    "crates/tux-search",
    "crates/tux-thumbnail",
    "crates/tux-install",
    "crates/tux-script",
    "crates/tux-ui",
    "crates/tux-store",
]

[workspace.package]
version = "0.17.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
crossbeam-channel = "0.5"
fastrand = "2"
flate2 = "1"
libc = "0.2"
libloading = "0.8"
quick-xml = "0.41"
slint = "1"
slint-build = "1"
tux-abi = { path = "crates/tux-abi" }
tux-backend = { path = "crates/tux-backend" }
tux-appstream = { path = "crates/tux-appstream" }
tux-taxonomy = { path = "crates/tux-taxonomy" }
tux-pacman = { path = "crates/tux-pacman" }
tux-libalpm = { path = "crates/tux-libalpm" }
alpm = { version = "5", default-features = false, features = ["pkg-config"] }

# ============================================================
# Default "release" profile — kept as-is for compatibility with
# any existing "cargo build --release" invocation. The two real
# modes are now "dist" (strong/slow, for GitHub Actions) and
# "dev" (fast, for local development/testing).
# ============================================================
[profile.release]
lto = "thin"
codegen-units = 4
strip = true
# panic MUST stay "unwind": every module entry point is wrapped in
# catch_unwind so a bug in one .so can never abort the whole process.
panic = "unwind"

# ============================================================
# 1) Strong/slow build mode — dedicated to GitHub Actions.
#    Goal: smallest possible binary, even if it takes a very long time.
#    Usage: cargo build --profile dist
# ============================================================
[profile.dist]
inherits = "release"
opt-level = "z"        # optimize for size, not speed
lto = "fat"             # full cross-crate LTO (slower, smaller output)
codegen-units = 1        # single codegen unit = smallest possible binary
strip = true             # strip debug symbols from the final binary
panic = "unwind"          # mandatory: catch_unwind relies on this, never change it
incremental = false

# ============================================================
# 2) Fast build mode — for local development and testing.
#    Goal: fastest possible compile time, even if the binary is
#    bigger and slower at runtime.
#    Usage: cargo build --profile dev  (or ./build.sh)
# ============================================================
[profile.dev]
opt-level = 0
debug = true
incremental = true
codegen-units = 256       # maximum parallelism during compilation
panic = "unwind"           # mandatory here too, even in dev mode