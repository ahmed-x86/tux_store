[workspace]
resolver = "2"
members = [
    "crates/tux-abi",
    "crates/tux-appstream",
    "crates/tux-taxonomy",
    "crates/tux-pacman",
    "crates/tux-libalpm",
    "crates/tux-search",
    "crates/tux-thumbnail",
    "crates/tux-install",
    "crates/tux-script",
    "crates/tux-ui",
    "crates/tux-store",
]

[workspace.package]
version = "0.15.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
crossbeam-channel = "0.5"
fastrand = "2"
flate2 = "1"
libc = "0.2"
libloading = "0.8"
quick-xml = "0.41"
slint = "1"
slint-build = "1"
tux-abi = { path = "crates/tux-abi" }
tux-appstream = { path = "crates/tux-appstream" }
tux-taxonomy = { path = "crates/tux-taxonomy" }
tux-pacman = { path = "crates/tux-pacman" }
tux-libalpm = { path = "crates/tux-libalpm" }
alpm = { version = "5", default-features = false, features = ["pkg-config"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
# panic MUST stay "unwind": every module entry point is wrapped in
# catch_unwind so a bug in one .so can never abort the whole process.
panic = "unwind"
