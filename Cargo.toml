[workspace]
resolver = "2"
members = [
    "crates/tux-abi",
    "crates/tux-pacman",
    "crates/tux-search",
    "crates/tux-thumbnail",
    "crates/tux-install",
    "crates/tux-ui",
    "crates/tux-store",
]

[workspace.package]
version = "0.4.0"
edition = "2026"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
crossbeam-channel = "0.5"
fastrand = "2"
libc = "0.2"
libloading = "0.8"
slint = "1"
slint-build = "1"
tux-abi = { path = "crates/tux-abi" }
tux-pacman = { path = "crates/tux-pacman" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
# panic MUST stay "unwind": every module entry point is wrapped in
# catch_unwind so a bug in one .so can never abort the whole process.
panic = "unwind"
