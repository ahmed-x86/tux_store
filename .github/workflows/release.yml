name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build in Arch Linux container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: archlinux:latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Install build dependencies
        run: |
          # curl: runtime dependency (icon downloads). python: only for the dlopen check.
          pacman -Syu --noconfirm --needed \
            base-devel git rust pkgconf \
            fontconfig libxkbcommon libglvnd \
            polkit util-linux xdg-utils curl python

      - name: Check out sources
        uses: actions/checkout@v4

      - name: Prepare build user and version
        run: |
          git config --global --add safe.directory '*'

          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION"

          # pkgver may not contain '-' (e.g. tag v1.0.0-rc1 -> 1.0.0_rc1).
          PKGVER="${VERSION//-/_}"
          sed -i "s/^pkgver=.*/pkgver=$PKGVER/" packaging/PKGBUILD

          # Make the binary report the tag's version too (first `version =`
          # line in Cargo.toml is [workspace.package]).
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml

      - name: Build and package with makepkg (compiles the whole workspace once)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          chown builder:builder "$GITHUB_WORKSPACE/dist"
          # PKGBUILD sets options=('!lto'): makepkg's default -flto breaks the
          # C/asm objects of build scripts and leaves module .so files with
          # undefined symbols.
          su builder -c "cd '$GITHUB_WORKSPACE/packaging' && \
            PKGDEST='$GITHUB_WORKSPACE/dist' makepkg --force --nodeps --noconfirm"
          ls -la dist

      - name: Verify every module library is loadable
        run: |
          fail=0
          for so in target/release/libtux_*.so; do
            echo "== $so"
            # No TLS/ring code may be linked into a module any more.
            if nm -D --undefined-only "$so" | grep -q 'ring_core'; then
              echo "::error::$so still references ring_core symbols"; fail=1
            fi
            # Every shared dependency must resolve in the container.
            if ldd "$so" | grep -q 'not found'; then
              ldd "$so" | grep 'not found'
              echo "::error::$so has unresolved shared libraries"; fail=1
            fi
            # Undefined *Rust/C* symbols that nothing provides would make
            # dlopen fail (rustc links with -z now).
            if ! python3 - "$so" <<'PY'
          import ctypes, sys
          try:
              ctypes.CDLL(sys.argv[1], mode=ctypes.RTLD_NOW)
          except OSError as e:
              if "undefined symbol" in str(e):
                  print(e); sys.exit(1)
          PY
            then
              echo "::error::$so fails to dlopen (undefined symbol)"; fail=1
            fi
          done
          exit $fail

      - name: Assemble portable tar.gz from the finished build
        run: |
          NAME="tux-store-${VERSION}-x86_64-linux"
          STAGE="$(mktemp -d)/$NAME"
          mkdir -p "$STAGE"

          install -m755 target/release/tux-store "$STAGE/"
          install -m755 target/release/libtux_*.so "$STAGE/"
          cp -r data "$STAGE/data"
          cp LICENSE README.md "$STAGE/"

          # Same file set as the installed package, runnable in place.
          ls "$STAGE"
          tar -C "$(dirname "$STAGE")" -czf "dist/${NAME}.tar.gz" "$NAME"

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.pkg.tar.* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tux-store-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          