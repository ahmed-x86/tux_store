name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build in Arch Linux container
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rust pkgconf \
            fontconfig libxkbcommon libglvnd \
            polkit util-linux xdg-utils

      - name: Check out sources
        uses: actions/checkout@v4

      - name: Prepare build user and version
        run: |
          git config --global --add safe.directory '*'

          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION"

          # The tag decides the package version.
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/PKGBUILD

      - name: Build and package with makepkg (compiles the whole workspace once)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          chown builder:builder "$GITHUB_WORKSPACE/dist"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging' && \
            PKGDEST='$GITHUB_WORKSPACE/dist' makepkg --force --nodeps --noconfirm"
          ls -la dist

      - name: Assemble portable tar.gz from the finished build
        run: |
          NAME="tux-store-${VERSION}-x86_64-linux"
          STAGE="$(mktemp -d)/$NAME"
          mkdir -p "$STAGE"

          install -m755 target/release/tux-store "$STAGE/"
          install -m755 target/release/libtux_*.so "$STAGE/"
          cp -r data "$STAGE/data"
          cp LICENSE README.md "$STAGE/"

          # Same file set as the installed package, runnable in place.
          ls "$STAGE"
          tar -C "$(dirname "$STAGE")" -czf "dist/${NAME}.tar.gz" "$NAME"

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.pkg.tar.* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tux-store-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
